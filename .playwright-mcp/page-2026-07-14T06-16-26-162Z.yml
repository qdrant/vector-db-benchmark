    - generic [ref=f9e42]:
      - generic [ref=f9e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f9e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f9e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f9e46]:
        - generic [ref=f9e47]: turbopuffer cold-start warmup · first 120 queries · H&M 4-replica pinned
        - 'generic "Cold-start latency warmup curve: queries start near 900ms and converge to ~43ms after 30 queries" [ref=f9e48]'
        - generic [ref=f9e49]: Latency converges from ~893ms → ~43ms as the NVMe cache warms. Each spike is a cold centroid region touched for the first time.
      - generic [ref=f9e50]:
        - generic [ref=f9e51]:
          - generic [ref=f9e52]: ●
          - text: turbopuffer
        - generic [ref=f9e53]:
