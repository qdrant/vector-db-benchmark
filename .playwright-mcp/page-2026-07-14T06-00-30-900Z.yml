  - main [ref=f4e41]:
    - generic [ref=f4e42]:
      - generic [ref=f4e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f4e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f4e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f4e46]:
        - generic [ref=f4e47]: turbopuffer cold-start warmup · first 120 queries · H&M 4-replica pinned
        - 'generic "Cold-start latency warmup curve: queries start near 900ms and converge to ~43ms after 30 queries" [ref=f4e48]'
        - generic [ref=f4e49]: Latency converges from ~893ms → ~43ms as the NVMe cache warms. Each spike is a cold centroid region touched for the first time.
