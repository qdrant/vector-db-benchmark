    - generic [ref=f8e42]:
      - generic [ref=f8e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f8e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f8e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f8e46]:
        - generic [ref=f8e47]:
          - generic [ref=f8e48]: ●
          - text: turbopuffer
        - generic [ref=f8e49]:
          - generic [ref=f8e50]: ●
          - text: Qdrant Cloud
