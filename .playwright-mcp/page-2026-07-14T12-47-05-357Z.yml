    - generic [ref=f14e36]:
      - generic [ref=f14e37]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f14e38]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f14e39]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f14e40]:
