    - generic [ref=f17e42]:
      - generic [ref=f17e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f17e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f17e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f17e46]:
        - generic [ref=f17e47]:
          - generic [ref=f17e48]: ●
          - text: turbopuffer
        - generic [ref=f17e49]:
          - generic [ref=f17e50]: ●
          - text: Qdrant Cloud
        - generic [ref=f17e51]: aws-us-west-2
        - generic [ref=f17e52]: 100K–105K vectors
