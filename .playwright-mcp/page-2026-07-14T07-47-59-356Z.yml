    - generic [ref=f18e42]:
      - generic [ref=f18e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f18e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f18e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f18e46]:
        - generic [ref=f18e47]:
          - generic [ref=f18e48]: ●
          - text: turbopuffer
        - generic [ref=f18e49]:
          - generic [ref=f18e50]: ●
          - text: Qdrant Cloud
        - generic [ref=f18e51]: aws-us-west-2
        - generic [ref=f18e52]: 100K–105K vectors
        - generic [ref=f18e53]: 768–2048 dims
    - generic [ref=f18e54]:
      - generic [ref=f18e55]:
        - generic [ref=f18e56]: §1
        - heading "What is turbopuffer?" [level=2] [ref=f18e57]
        - paragraph [ref=f18e58]: turbopuffer is an S3-backed vector database built around SPFresh centroid-based ANN search. It stores the vector index on object storage and uses a local NVMe cache to accelerate repeated queries. It offers two deployment modes — serverless and pinned — and deliberately exposes no recall tuning knobs.
      - list [ref=f18e59]:
        - listitem [ref=f18e60]:
          - text: ▸
          - strong [ref=f18e61]: No recall tuning.
          - text: Locked at 89.14% recall on filtered search and 98.51% on unfiltered. You cannot trade latency for recall.
        - listitem [ref=f18e62]:
          - text: ▸
          - strong [ref=f18e63]: Serverless mode.
          - text: Shared compute, scales to zero between queries, inherent noisy-neighbor risk when multiple namespaces share a host.
        - listitem [ref=f18e64]:
          - text: ▸
          - strong [ref=f18e65]: Pinned mode.
          - text: Dedicated NVMe, fixed replicas, full machine isolation. Eliminates noisy-neighbor contention but removes scale-to-zero savings.
        - listitem [ref=f18e66]:
          - text: ▸
          - strong [ref=f18e67]: Cold-start penalty.
          - text: "After any restart, the first queries must fetch index data from S3 before NVMe is warm. Penalty: 100–1500ms on first queries, converging to steady-state after ~30 requests."
        - listitem [ref=f18e68]:
          - text: ▸
          - strong [ref=f18e69]: SPFresh algorithm.
          - text: Centroid-based ANN that post-filters for attribute predicates rather than integrating filters into graph traversal. Leads to measurable recall drops under selective filter conditions.
        - listitem [ref=f18e70]:
          - text: ▸
          - strong [ref=f18e71]: Write pipeline & index visibility.
          - text: Writes are group-committed (100–250ms window) and flushed as an append-only WAL entry to S3. Indexing (SPFresh centroid tree) is asynchronous — new vectors are
          - emphasis [ref=f18e72]: immediately readable
          - text: via exhaustive WAL scan before the index is built. There is no write-blocking indexing phase (unlike Qdrant’s HNSW build). With strong consistency (default), each query checks S3 for the latest WAL version, adding ~10ms overhead — this is the architectural source of the 10ms server-side latency floor. Eventual consistency mode skips this check (sub-10ms possible, up to ~1h staleness).
