    - strong [ref=f29e71]: "Model:"
    - text: RAM = vectors × dim × 4 B × 1.5 ÷ quantization ÷ 10⁹ (same as the Qdrant capacity planner); disk = RAM (+ quantized copy). Cost = replicas × (vCPU × CPU-rate + RAM × mem-rate + disk × disk-rate). Rates from
    - link "sirupsen/napkin-math" [ref=f29e72] [cursor=pointer]:
      - /url: https://github.com/sirupsen/napkin-math#cost-numbers
    - text: "\"Cost Numbers\" (rounded, cross-provider). This is a margin-free hardware floor — a managed service (Qdrant Cloud) charges more for the same shape. The vCPU figure is a rough provisioning placeholder (default ≈1 vCPU per 4 GB RAM, min 1); real vector-search CPU tracks query load (QPS × per-query work) and recall/ef, so refine it for your workload."