      - generic [ref=f15e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f15e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f15e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f15e46]:
