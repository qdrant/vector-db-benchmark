        - listitem [ref=f15e959]: ~350K vectors at 2048-dim (e.g. OpenAI text-embedding-3-large)
      - paragraph [ref=f15e960]:
        - text: Below these sizes, Qdrant is cheaper even at zero QPS. At 4 replicas (required for reliable filtered search in production), there is
        - strong [ref=f15e961]: no break-even at all
        - text: — 4 replicas is the same data replicated, not 4× more data capacity. The minimum 4r cost ($2,476) always exceeds Qdrant's $26.10 regardless of dataset size.
      - generic [ref=f15e962]:
        - strong [ref=f15e963]: The "~8–13 QPS cost crossover" applies only to serverless mode.
        - text: When filtered search or isolation requirements force pinning, that crossover disappears entirely. For pinned 1r, break-even requires >2.7 GB actual data. For pinned 4r, there is no break-even — $2,476/month minimum vs $26.10.
