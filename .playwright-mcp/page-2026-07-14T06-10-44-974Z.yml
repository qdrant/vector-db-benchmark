    - generic [ref=f7e42]:
      - generic [ref=f7e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f7e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f7e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f7e46]:
        - generic [ref=f7e47]: turbopuffer cold-start warmup · first 120 queries · H&M 4-replica pinned
        - 'generic "Cold-start latency warmup curve: queries start near 900ms and converge to ~43ms after 30 queries" [ref=f7e48]'
        - generic [ref=f7e49]: Latency converges from ~893ms → ~43ms as the NVMe cache warms. Each spike is a cold centroid region touched for the first time.
      - generic [ref=f7e50]:
        - generic [ref=f7e51]:
          - generic [ref=f7e52]: ●
          - text: turbopuffer
        - generic [ref=f7e53]:
