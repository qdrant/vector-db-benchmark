    - generic [ref=f2e54]:
      - generic [ref=f2e55]:
        - generic [ref=f2e56]: §1
        - heading "What is turbopuffer?" [level=2] [ref=f2e57]
        - paragraph [ref=f2e58]: turbopuffer is an S3-backed vector database built around SPFresh centroid-based ANN search. It stores the vector index on object storage and uses a local NVMe cache to accelerate repeated queries. It offers two deployment modes — serverless and pinned — and deliberately exposes no recall tuning knobs.
      - list [ref=f2e59]:
        - listitem [ref=f2e60]:
          - text: ▸
          - strong [ref=f2e61]: No recall tuning.
          - text: Locked at 89.14% recall on filtered search and 98.51% on unfiltered. You cannot trade latency for recall.
        - listitem [ref=f2e62]:
          - text: ▸
          - strong [ref=f2e63]: Serverless mode.
          - text: Shared compute, scales to zero between queries, inherent noisy-neighbor risk when multiple namespaces share a host.
        - listitem [ref=f2e64]:
          - text: ▸
          - strong [ref=f2e65]: Pinned mode.
          - text: Dedicated NVMe, fixed replicas, full machine isolation. Eliminates noisy-neighbor contention but removes scale-to-zero savings.
        - listitem [ref=f2e66]:
          - text: ▸
          - strong [ref=f2e67]: Cold-start penalty.
          - text: "After any restart, the first queries must fetch index data from S3 before NVMe is warm. Penalty: 100–1500ms on first queries, converging to steady-state after ~30 requests."
        - listitem [ref=f2e68]:
          - text: ▸
          - strong [ref=f2e69]: SPFresh algorithm.
          - text: Centroid-based ANN that post-filters for attribute predicates rather than integrating filters into graph traversal. Leads to measurable recall drops under selective filter conditions.
        - listitem [ref=f2e70]:
          - text: ▸
          - strong [ref=f2e71]: Write pipeline & index visibility.
          - text: Writes are group-committed (100–250ms window) and flushed as an append-only WAL entry to S3. Indexing (SPFresh centroid tree) is asynchronous — new vectors are
          - emphasis [ref=f2e72]: immediately readable
          - text: via exhaustive WAL scan before the index is built. There is no write-blocking indexing phase (unlike Qdrant’s HNSW build). With strong consistency (default), each query checks S3 for the latest WAL version, adding ~10ms overhead — this is the architectural source of the 10ms server-side latency floor. Eventual consistency mode skips this check (sub-10ms possible, up to ~1h staleness).
