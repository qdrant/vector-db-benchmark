      - generic [ref=f1e1016]:
        - generic [ref=f1e1017]: §9
        - heading "Strategic Implications" [level=2] [ref=f1e1018]
        - paragraph [ref=f1e1019]: These results point to specific architectural decisions rather than a simple winner. The right choice is a function of your QPS profile, filter selectivity, tenant concurrency pattern, dataset size, and tolerance for cold-start latency.
      - list [ref=f1e1020]:
        - listitem [ref=f1e1021]:
          - strong [ref=f1e1022]: Below its break-even QPS, serverless turbopuffer saves money.
          - text: That break-even is ~9 QPS for DBpedia & H&M (Qdrant fits a $31 2 GB node) but ~25 QPS for multi-tenant (Qdrant needs an $82 8 GB node) — the bigger the Qdrant node your data forces, the higher the break-even. Above it, Qdrant is cheaper and faster.
          - emphasis [ref=f1e1023]: This only applies to serverless mode.
        - listitem [ref=f1e1024]:
          - strong [ref=f1e1025]: Pinned mode has a billing floor that dominates small datasets.
          - text: For any dataset under ~10 GB, pinned turbopuffer costs 10–79× more than Qdrant Cloud with no performance benefit. Workloads that need consistent low-latency (no cold-start variance) pay this premium regardless of query type.
        - listitem [ref=f1e1026]:
          - strong [ref=f1e1027]: Serverless noisy-neighbor is a real operational risk.
          - text: A single bursty tenant in serverless mode triples all other tenants' p50 latency. Pinning eliminates this but removes scale-to-zero. Design your tenancy model before choosing serverless.
        - listitem [ref=f1e1028]:
          - strong [ref=f1e1029]: Filtered search recall is not tunable on turbopuffer.
          - text: If your workload uses selective attribute filters and 89.14% recall is insufficient, Qdrant is the only option. This constraint is architectural, not a configuration gap.
        - listitem [ref=f1e1030]:
          - strong [ref=f1e1031]: Multi-tenant idle SaaS is turbopuffer's strongest case.
          - text: If most tenants are mostly idle, scale-to-zero is worth real money. At active-tenant load Qdrant leads single-stream (57 vs 24 RPS measured at p=1), but under heavy concurrency (p=32) tpuf holds ~94 RPS while the 2-CPU Qdrant node saturates to ~57 RPS. Size the Qdrant node to the concurrency you expect.
        - listitem [ref=f1e1032]:
          - strong [ref=f1e1033]: Cold-start latency must be part of your SLA calculation.
          - text: The 1,891ms p99 cold-start is not a fringe edge case — it occurs after any restart, any scale-to-zero event in serverless mode. Plan pre-warm queries or accept the SLA window.