      - heading "9.2 — Break-Even Analysis" [level=3] [ref=f10e1391]
      - paragraph [ref=f10e1392]:
        - text: For pinned 1-replica to match Qdrant's $26.10/month node cost, actual data must exceed
        - strong [ref=f10e1393]: 2.7 GB
        - text: "(so billing escapes the 64 GB floor and the compute cost drops below $26.10). That is approximately:"
      - list [ref=f10e1394]:
