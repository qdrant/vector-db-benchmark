    - generic [ref=f2e42]:
      - generic [ref=f2e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f2e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f2e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
