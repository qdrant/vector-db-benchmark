      - generic [ref=f3e805]:
        - strong [ref=f3e806]: "Serverless noisy-neighbor:"
        - text: a bursty tenant triples victim latency (14.9ms → 52.8ms, +255%). Pinning reduces this to a 20% variance (16.3ms → 19.5ms). If your workload includes any bursty tenants in serverless mode, all other tenants under the same API key are affected.
