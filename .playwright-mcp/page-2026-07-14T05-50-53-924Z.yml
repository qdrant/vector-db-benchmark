      - generic [ref=f3e238]:
        - generic [ref=f3e239]: Upload Time — Upsert + Index Build
        - generic [ref=f3e240]: "Stacked bars: solid = upsert, lighter = index build (SPFresh or HNSW). Total = time to fully-indexed state. Seconds."
        - generic "Stacked horizontal bar chart showing upsert and index build times per engine and dataset" [ref=f3e241]
        - generic [ref=f3e242]: "‡ Total time = upsert + index build (end-to-end until fully indexed). For H&M Qdrant concurrent: 5.5 min upsert + 2.8 min HNSW = 8.4 min. For DBpedia: 3.9 min upsert, HNSW built concurrently so extra wait ≈ 0s.† Index wait = additional time after last upsert batch until fully indexed. 0s means HNSW finished within the upsert window. turbopuffer SPFresh builds asynchronously after writes commit to S3 WAL — 60s for H&M 105K×2048d.†† DBpedia tpuf SPFresh varied across 5 repeated runs (25s, 36s, 61s, 183s, 268s) depending on shared indexer availability; the 61s trial used an earlier query-based completion signal and is less precise than the other four (index-status polling). Total wall-clock ranges 3.1–7.3 min accordingly. Pinned-1r SPFresh was not measured separately — writes take the same S3 WAL path in both modes, so the same range likely applies (upload alone = 2.6 min).* MT tpuf WPS is aggregate wall-clock throughput across 10 concurrent namespace uploads. Per-namespace WPS ≈ 624."
      - generic [ref=f3e243]:
        - text: The multi-tenant dataset is
        - strong [ref=f3e244]: 1M vectors total
        - text: (100 tenants × 10K each) — 10× more data than DBpedia. Qdrant uploads all 1M sequentially in batches to one collection (
        - code [ref=f3e245]: payload_m=16
        - text: ","
        - code [ref=f3e246]: is_tenant=True
        - text: ), building per-tenant HNSW sub-graphs in the background. turbopuffer uploads 100 namespaces in
        - strong [ref=f3e247]: parallel
        - text: (asyncio.gather, semaphore=10 concurrent), so its 2.4 min wall-clock reflects parallel throughput. Sequential uploads at ~624 WPS per namespace would take
        - strong [ref=f3e248]: ~26.7 min
        - text: (100 × ~16s) — parallelism delivers an
        - strong [ref=f3e249]: ~11× speedup
        - text: . Both engines use the same batch size (128 vectors/batch). The methodology difference (parallel vs sequential) accounts for most of the 8.5× wall-clock gap; Qdrant also pays extra for HNSW sub-graph construction at write time.
      - generic [ref=f3e250]:
        - strong [ref=f3e251]: "Write-time vs query-time:"
        - text: "turbopuffer stores 0.615 GB for DBpedia (≈ raw vector size: 100K × 1536-dim × 4B). Qdrant builds HNSW at write time — 168s for H&M, ~0s for DBpedia (concurrent), 5.1s for MT sub-graphs. This one-time write cost is the source of Qdrant’s 1.9ms query server latency: the index is in RAM, already built. turbopuffer’s SPFresh index is built"
        - emphasis [ref=f3e252]: asynchronously
        - text: after writes commit to the S3 WAL — writes return immediately (no blocking index phase). SPFresh duration depends on shared indexer availability and varied from 25s to 268s across 5 DBpedia runs. During the SPFresh window, WAL vectors are brute-force scanned per query. Once built, queries use the centroid index from NVMe.
      - generic [ref=f3e253]:
        - strong [ref=f3e254]: Pinning does not affect write throughput.
        - text: "Measured on DBpedia 100K×1536: serverless 624 WPS vs pinned-1r 633 WPS — statistically identical. batch_p99 is slightly lower pinned (295ms vs 352ms), likely from reduced noisy-neighbor contention on a dedicated machine. Writes go directly to S3 WAL in both modes; the pinned replica only serves reads from its NVMe cache. Single-replica tpuf write capacity:"
        - strong [ref=f3e255]: ~625 WPS
        - text: at batch=128 for 1536-dim vectors.
      - generic [ref=f3e256]:
        - strong [ref=f3e257]: tpuf raw upload WPS (~565–657) is 50–60% faster than Qdrant (~316–417)
        - text: ", but SPFresh builds the centroid index asynchronously on shared background indexers, and its duration depends on indexer availability at the time of upload. Across 5 DBpedia re-runs, SPFresh completed in 25s, 36s, 61s, 183s, and 268s — putting tpuf total at 3.1–7.3 min. Qdrant’s consistent 3.9 min falls inside that range: tpuf wins when indexers are available, Qdrant wins when they are not. H&M measured 60s SPFresh (4.1 min total) and beat Qdrant (8.4 min) — though with only one H&M trial, the SPFresh variance seen on DBpedia (25–268s) means the margin could narrow to ~0.8 min on a slow indexer draw. The deferred Qdrant experiment confirms concurrent HNSW is optimal: running HNSW"
        - emphasis [ref=f3e258]: after
        - text: upload (5.3 min DBpedia, 9.1 min H&M) is slower than concurrent (3.9 min, 8.4 min).
