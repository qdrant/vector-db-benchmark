      - heading "8.6 — Server-Side Latency Gap" [level=3] [ref=f3e793]
      - paragraph [ref=f3e794]:
        - text: Measuring server-reported latency (excluding network round-trip) reveals an architectural floor difference. At steady state on DBpedia (unfiltered), turbopuffer server latency is consistently
        - strong [ref=f3e795]: ~10ms
        - text: while Qdrant server latency is
        - strong [ref=f3e796]: ~1.9ms
        - text: .
      - generic [ref=f3e797]:
        - strong [ref=f3e798]: Qdrant server latency is 1.9ms (HNSW index in RAM); tpuf server latency floor is 10ms (NVMe centroid traversal). This 5× gap is architectural and irreducible regardless of network.
        - text: "The gap reflects the fundamental storage medium: HNSW traversal on RAM vs. SPFresh centroid reads from NVMe. No configuration on either side can close it."
      - heading "8.7 — Cross-Namespace Contention (Serverless)" [level=3] [ref=f3e799]
      - paragraph [ref=f3e800]: A high-throughput "aggressor" namespace and a "victim" namespace both sharing the same API key on serverless. The aggressor runs at full blast; we measure what happens to victim latency.
      - generic [ref=f3e801]:
        - generic [ref=f3e802]: Victim p50 Latency — Baseline vs Under Aggressor Load
        - generic [ref=f3e803]: Serverless co-locates all API-key namespaces on one host. Pinning provides machine isolation.
