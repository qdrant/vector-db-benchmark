  - main [ref=f20e41]:
    - generic [ref=f20e42]:
      - generic [ref=f20e43]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f20e44]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f20e45]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f20e46]:
        - generic [ref=f20e47]:
          - generic [ref=f20e48]: ●
          - text: turbopuffer
        - generic [ref=f20e49]:
          - generic [ref=f20e50]: ●
          - text: Qdrant Cloud
        - generic [ref=f20e51]: aws-us-west-2
        - generic [ref=f20e52]: 100K–105K vectors
