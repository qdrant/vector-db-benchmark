    - generic [ref=f13e36]:
      - generic [ref=f13e37]: Vector Database Benchmark · 2026
      - heading "turbopuffer vs Qdrant Cloud Detailed Benchmark Report" [level=1] [ref=f13e38]: turbopuffer vs Qdrant CloudDetailed Benchmark Report
      - paragraph [ref=f13e39]: Three datasets, four concurrency levels, upload throughput, filtered search, multi-tenant isolation, and cost modeling — from a single EC2 host in aws-us-west-2, same region as both services.
      - generic [ref=f13e40]:
        - generic [ref=f13e41]:
          - generic [ref=f13e42]: ●
          - text: turbopuffer
        - generic [ref=f13e43]:
          - generic [ref=f13e44]: ●
          - text: Qdrant Cloud
        - generic [ref=f13e45]: aws-us-west-2
        - generic [ref=f13e46]: 100K–105K vectors
        - generic [ref=f13e47]: 768–2048 dims
    - generic [ref=f13e48]:
      - generic [ref=f13e49]:
        - generic [ref=f13e50]: §1
        - heading "What is turbopuffer?" [level=2] [ref=f13e51]
        - paragraph [ref=f13e52]: turbopuffer is an S3-backed vector database built around SPFresh centroid-based ANN search. It stores the vector index on object storage and uses a local NVMe cache to accelerate repeated queries. It offers two deployment modes — serverless and pinned — and deliberately exposes no recall tuning knobs.
      - list [ref=f13e53]:
        - listitem [ref=f13e54]:
          - text: ▸
          - strong [ref=f13e55]: No recall tuning.
          - text: Locked at 89.14% recall on filtered search and 98.51% on unfiltered. You cannot trade latency for recall.
        - listitem [ref=f13e56]:
          - text: ▸
          - strong [ref=f13e57]: Serverless mode.
          - text: Shared compute, scales to zero between queries, inherent noisy-neighbor risk when multiple namespaces share a host.
        - listitem [ref=f13e58]:
          - text: ▸
          - strong [ref=f13e59]: Pinned mode.
          - text: Dedicated NVMe, fixed replicas, full machine isolation. Eliminates noisy-neighbor contention but removes scale-to-zero savings.
        - listitem [ref=f13e60]:
          - text: ▸
          - strong [ref=f13e61]: Cold-start penalty.
          - text: "After any restart, the first queries must fetch index data from S3 before NVMe is warm. Penalty: 100–1500ms on first queries, converging to steady-state after ~30 requests."
        - listitem [ref=f13e62]:
          - text: ▸
          - strong [ref=f13e63]: SPFresh algorithm.
          - text: Centroid-based ANN that post-filters for attribute predicates rather than integrating filters into graph traversal. Leads to measurable recall drops under selective filter conditions.
        - listitem [ref=f13e64]:
          - text: ▸
          - strong [ref=f13e65]: Write pipeline & index visibility.
          - text: Writes are group-committed (100–250ms window) and flushed as an append-only WAL entry to S3. Indexing (SPFresh centroid tree) is asynchronous — new vectors are
          - emphasis [ref=f13e66]: immediately readable
          - text: via exhaustive WAL scan before the index is built. There is no write-blocking indexing phase (unlike Qdrant’s HNSW build). With strong consistency (default), each query checks S3 for the latest WAL version, adding ~10ms overhead — this is the architectural source of the 10ms server-side latency floor. Eventual consistency mode skips this check (sub-10ms possible, up to ~1h staleness).
