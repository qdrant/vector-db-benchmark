        - strong [ref=f13e98]: RPS/worker
        - text: = 1/mean latency of a single worker (a latency measure);
        - strong [ref=f13e99]: ~Total RPS
        - text: "≈ p × RPS/worker is the wall-clock throughput — use it for capacity comparisons. Latency is reported two ways:"
        - strong [ref=f13e100]: search latency
        - text: is end-to-end as measured by the client (engine processing + network + client overhead), while
        - strong [ref=f13e101]: internal search latency
        - text: is the engine’s own internal processing time (no network) — so it is always the smaller of the two. Recall is measured against exact brute-force ground truth for every query.
