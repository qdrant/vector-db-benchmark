      - generic [ref=f18e1033]:
        - generic [ref=f18e1034]: §9
        - heading "Strategic Implications" [level=2] [ref=f18e1035]
        - paragraph [ref=f18e1036]: These results point to specific architectural decisions rather than a simple winner. The right choice is a function of your QPS profile, filter selectivity, tenant concurrency pattern, dataset size, and tolerance for cold-start latency.
      - list [ref=f18e1037]:
        - listitem [ref=f18e1038]:
          - strong [ref=f18e1039]: Below ~8–13 QPS/namespace (scale-dependent), serverless turbopuffer saves money.
          - text: Above it, Qdrant is both cheaper and faster. The break-even is stable across dataset scales — plan around it.
          - emphasis [ref=f18e1040]: This only applies to serverless mode.
        - listitem [ref=f18e1041]:
          - strong [ref=f18e1042]: Pinned mode has a billing floor that dominates small datasets.
          - text: For any dataset under ~10 GB, pinned turbopuffer costs 10–95× more than Qdrant Cloud with no performance benefit. Workloads that need consistent low-latency (no cold-start variance) pay this premium regardless of query type.
        - listitem [ref=f18e1043]:
          - strong [ref=f18e1044]: Serverless noisy-neighbor is a real operational risk.
          - text: A single bursty tenant in serverless mode triples all other tenants' p50 latency. Pinning eliminates this but removes scale-to-zero. Design your tenancy model before choosing serverless.
        - listitem [ref=f18e1045]:
          - strong [ref=f18e1046]: Filtered search recall is not tunable on turbopuffer.
          - text: If your workload uses selective attribute filters and 89.14% recall is insufficient, Qdrant is the only option. This constraint is architectural, not a configuration gap.
        - listitem [ref=f18e1047]:
          - strong [ref=f18e1048]: Multi-tenant idle SaaS is turbopuffer's strongest case.
          - text: If most tenants are mostly idle, scale-to-zero is worth real money. At active-tenant load, Qdrant is 5.5× faster per request (184.6 vs 33.5 RPS single-stream) — though under heavy concurrency (p=32) tpuf’s autoscaling out-delivers the saturated 2CPU Qdrant node in total throughput (~538 vs ~304 RPS). Size the Qdrant node to the concurrency you expect.
        - listitem [ref=f18e1049]:
          - strong [ref=f18e1050]: Cold-start latency must be part of your SLA calculation.
          - text: The 1,891ms p99 cold-start is not a fringe edge case — it occurs after any restart, any scale-to-zero event in serverless mode. Plan pre-warm queries or accept the SLA window.