        - strong [ref=f19e305]:
          - code [ref=f19e306]: hint_cache_warm
          - text: used inline is 13× worse than default serverless.
        - text: The cache-warm RPC is a synchronous call adding ~400ms overhead before each query. It is designed for pre-warming a cold namespace before a burst (send the hint, wait, then serve) — not as a per-query prefix. Using it inline inverts its intended effect entirely.
