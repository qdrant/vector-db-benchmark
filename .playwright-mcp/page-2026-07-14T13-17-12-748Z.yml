  - main [ref=f23e41]:
    - generic [ref=f23e42]:
      - generic [ref=f23e43]: Companion · Internals & Deep Dives
      - heading "turbopuffer Internals & Deep Dives" [level=1] [ref=f23e44]
      - paragraph [ref=f23e45]: Nine operational deep-dives into how turbopuffer behaves under the hood — cold-start, replica boot, scaling, contention, concurrent writes — and how Qdrant disk mode compares.
      - paragraph [ref=f23e46]:
        - link "← Main benchmark report" [ref=f23e47] [cursor=pointer]:
          - /url: tpuf-detailed-report.html
    - generic [ref=f23e48]:
      - text: "Nine experiments that reveal how turbopuffer behaves under the hood and how it compares to Qdrant disk mode. Key findings: (1) SPFresh does lazy per-centroid NVMe caching — ~75 sequential queries to reach stable warm latency, no global pre-fetch. (2) A single pinned replica saturates at ~6–8 CPU cores; serverless outperforms it at p≥8. (3) Correctly-warmed 4-replica pinned peaks at 473 RPS — NVMe bandwidth, not CPU, is the ceiling. (4) A pinned replica takes ~80s to become"
      - code [ref=f23e49]: ready
      - text: and is still cold after that — first query hits ~600ms. (5)
      - code [ref=f23e50]: hint_cache_warm
      - text: "used inline is 13× worse than default — it is for pre-warming, not per-query prefix. (6) All namespaces under one API key share one physical machine in serverless mode; a bursty tenant degrades all others ~3×. (7) Pinning has zero effect on write throughput (624 vs 633 WPS). (8) During concurrent writes, tpuf's WAL exhaustive scan rescues recall at the cost of 1.8× higher p99 — latency normalises within seconds of indexing completing. (9) Qdrant disk mode has bimodal behavior: p99=1,457ms cold (EBS random I/O storm) vs p99=10ms warm — once 586 MB fits in OS page cache the disk-mode penalty disappears entirely."
