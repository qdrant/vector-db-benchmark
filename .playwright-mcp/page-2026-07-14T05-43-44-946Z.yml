      - emphasis [ref=f2e486]: default-journal
      - text: upload is ~15Ã— slower (64 s), but switching to WAL (still power-loss durable, synchronous=FULL) drops it to 10 s / 9.6 K vec/s â€” a 6.4Ã— ingest speedup with query & RAM unchanged. IVF_FLAT is the middle option â€” nprobes-tunable (full 8-point curve in the report), leaner (1.3 GB) and ~2Ã— faster to build than LanceDB's HNSW, but at matched 0.98 recall (nprobes=48) it's 22 ms â€” ~12Ã— slower than Edge HNSW, ~3Ã— than LanceDB HNSW. (A num_partitionsÃ—nprobes sweep in the report shows num_partitions=512 trims this to 18 ms @ 0.98 â€” more/smaller cells beat the âˆšNâ‰ˆ256 default.)
    - paragraph [ref=f2e487]:
      - strong [ref=f2e488]: IVF_FLAT geometry â€” num_partitions Ã— nprobes
      - text: (dbpedia). Cell = recall@10 @ p50 latency; nprobes as a fraction of partitions. More/smaller cells reach a target recall by scanning fewer vectors â€” num_partitions=512 hits ~0.98 fastest (18 ms). nprobes=P is a full exact scan (~85 ms) at any P.
